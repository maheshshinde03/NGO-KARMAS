  <!-- Right Form Section -->
  <div class="ngo-form-section">
    <div class="ngo-card glass-card">

      <div class="ngo-card-header">
        <div class="header-left">
          <h4>NGO Registration</h4>
          <small>Secure & verified onboarding process</small>
        </div>
        <button class="status-badge" *ngIf="ngoDetailsData?.data?.status_name"
          [ngClass]="getStatusClass(ngoDetailsData.data.status_name)">

          <i class="status-icon"></i>
          {{ ngoDetailsData.data.status_name }}
        </button>
        <button class="btn-back" (click)="goToLogin()">← Back</button>
      </div>

      <div class="ngo-card-body">
        <app-form [formConfig]="ngoTypeSearchGroupStructure" [formData]="ngoDetailsData.data"
          (emitData)="handleSubmit($event)" (selectValueChangeChange)="selectValueChange($event)"
          (photoBase64Uploaded)="handleFileUpload($event)" [actiontype]="routeName" [isSubmit]="true">
        </app-form>
      </div>

    </div>
  </div>

</div>
