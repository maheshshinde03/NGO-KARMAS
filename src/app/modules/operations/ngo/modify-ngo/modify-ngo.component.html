<ng-template #ngoProfile>
    <app-form [formConfig]="ngoTypeSearchGroupStructure" [actiontype]="routeName" [isNext]="true" (emitData)="handleSubmit($event,'ngProfile')"
    [formData]="ngoDetailsData.data" (selectValueChangeChange)="selectValueChange($event)" (photoBase64Uploaded)="handleFileUpload($event)"></app-form>
    <!-- <app-airwaybill [editData]="shipmentDataOnEdit" (emitData)="handleSubmitAirWayBill($event)"></app-airwaybill> -->
</ng-template>


<ng-template #ngoOfficeBearers>
    <!-- <app-form [formConfig]="ngoOfficeBearersFormGroup" [actiontype]="routeName" [isNext]="true" (emitData)="handleSubmit($event,'ngoOfficeBearers')"
    [formData]="this.ngoDetailsData.data"></app-form>

    <app-table [jsonData]="nGOOfficeBearersDetailsTable" (handleDeleteAction)="handleDeleteAction($event)"></app-table> -->

            <div class="custom-row">
                <app-popup-form (handleCreateAction)="handleCreateAction('officeBearers')" [formDetailsData]="nGOOfficeBearersDetailsTable"></app-popup-form>

            </div>
