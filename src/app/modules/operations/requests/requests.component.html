<div class="row mr-3">
    <div class="col" *ngFor="let card of requestStatusCard">
        <app-dashboard-card [number]="card.number" [label]="card.label" (click)="handleCardClickAction(card)"></app-dashboard-card>
    </div>
</div>


<app-table [jsonData]="requestDetailsData" (handleCreateAction)="handleCreateAction()"
    (handleDeleteAction)="handleDeleteAction($event)" (handleEditAction)="handleEditAction($event)"
    (handleViewAction)="handleViewAction($event)" (handleSelectRowAction)="handleEditAction($event)"></app-table>
