<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Coming Soon</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet" />

    <style>
        :root {
            --bg-1: #f1f5f9;
            --bg-2: #e0f2fe;
            --accent-1: #16a34a;
            --accent-2: #22c55e;
            --accent-3: #0ea5e9;
            --accent-4: #f97316;
            --accent-pink: #ec4899;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --radius-xl: 26px;
            --shadow-xl: 0 30px 80px rgba(15, 23, 42, 0.18);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(circle at top left, #fef9c3 0%, #e0f2fe 35%, #f1f5f9 70%, #ecfdf5 100%);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }

        .cs-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        /* Soft background shapes */
        .blob {
            position: absolute;
            width: 360px;
            height: 360px;
            border-radius: 999px;
            filter: blur(40px);
            opacity: 0.7;
            z-index: -1;
        }

        .blob--green {
            background: radial-gradient(circle, rgba(34, 197, 94, 0.8), transparent 60%);
            top: -80px;
            left: -80px;
            animation: floatA 16s ease-in-out infinite;
        }

        .blob--blue {
            background: radial-gradient(circle, rgba(56, 189, 248, 0.8), transparent 60%);
            bottom: -120px;
            right: -40px;
            animation: floatB 18s ease-in-out infinite;
        }

        .blob--orange {
            background: radial-gradient(circle, rgba(249, 115, 22, 0.7), transparent 60%);
            top: 60%;
            left: 55%;
            transform: translate(-50%, -50%);
            animation: pulse 20s ease-in-out infinite;
        }

        /* subtle ground shadow under card */
        .cs-ground-glow {
            position: absolute;
            bottom: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 520px;
            max-width: 80vw;
            height: 120px;
            background: radial-gradient(circle, rgba(15, 23, 42, 0.3), transparent 70%);
            opacity: 0.4;
            pointer-events: none;
            z-index: 0;
        }

        .cs-card {
            position: relative;
            width: 100%;
            max-width: 980px;
            background: var(--card-bg);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            border: 1px solid rgba(148, 163, 184, 0.25);
            overflow: hidden;
            display: grid;
            grid-template-columns: minmax(0, 1.35fr) minmax(0, 1.15fr);
            min-height: 340px;
            z-index: 1;
        }

        .cs-card::before {
            content: "";
            position: absolute;
            inset: 1px;
            border-radius: calc(var(--radius-xl) - 1px);
            border: 1px solid rgba(148, 163, 184, 0.18);
            pointer-events: none;
            z-index: 2;
        }

        /* top mini bar for brand feel */
        .cs-top-bar {
            position: absolute;
            inset-inline: 26px;
            top: 18px;
            z-index: 3;
            display: flex;
            align-items: center;
            justify-content: space-between;
            pointer-events: none;
        }

        .cs-logo-chip {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.12);
            pointer-events: auto;
        }

        .cs-logo-letter {
            width: 22px;
            height: 22px;
            border-radius: 999px;
            background: radial-gradient(circle at 30% 20%, #22c55e, #0ea5e9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            color: #f9fafb;
            font-family: "Poppins", system-ui, sans-serif;
        }

        .cs-logo-text {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            color: #4b5563;
            font-weight: 600;
        }

        .cs-top-note {
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: rgba(75, 85, 99, 0.9);
            pointer-events: auto;
        }

        .cs-left {
            padding: 56px 36px 32px;
            background: linear-gradient(145deg, #ffffff 0%, #ecfeff 40%, #f0fdf4 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
            z-index: 1;
        }

        .cs-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            background: rgba(34, 197, 94, 0.08);
            border: 1px solid rgba(34, 197, 94, 0.18);
            margin-bottom: 6px;
            width: fit-content;
        }

        .cs-pill-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
            background: var(--accent-1);
            box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.18);
        }

        .cs-pill span {
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--accent-1);
            font-weight: 600;
            white-space: nowrap;
        }

        .cs-name {
            font-family: "Poppins", system-ui, sans-serif;
            font-weight: 700;
            font-size: 34px;
            letter-spacing: 0.04em;
            margin-bottom: 4px;
            color: var(--text-main);
        }

        .cs-name span {
            background: linear-gradient(90deg, #16a34a, #0ea5e9, #ec4899);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .cs-coming {
            font-family: "Poppins", system-ui, sans-serif;
            font-weight: 600;
            font-size: 18px;
            letter-spacing: 0.4em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 14px;
            position: relative;
            display: inline-block;
            padding-right: 10px;
            overflow: hidden;
        }

        .cs-coming span {
            background: linear-gradient(120deg, #0ea5e9, #22c55e, #f97316, #ec4899);
            background-size: 200% 100%;
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            animation: shimmer 5s ease-in-out infinite;
        }

        .cs-coming::after {
            content: "";
            display: block;
            width: 110px;
            height: 3px;
            border-radius: 999px;
            margin-top: 14px;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-4), var(--accent-3), var(--accent-pink));
            animation: barFlow 5s ease-in-out infinite;
        }

        .cs-tagline {
            margin-top: 4px;
            font-size: 13px;
            color: var(--text-muted);
            max-width: 32rem;
        }

        .cs-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 16px;
        }

        .cs-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 11px;
            background: rgba(226, 232, 240, 0.9);
            color: #111827;
            box-shadow: 0 6px 16px rgba(148, 163, 184, 0.35);
        }

        .cs-badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 999px;
        }

        .cs-badge--green .cs-badge-dot {
            background: var(--accent-1);
        }

        .cs-badge--blue .cs-badge-dot {
            background: var(--accent-3);
        }

        .cs-badge--orange .cs-badge-dot {
            background: var(--accent-4);
        }

        .cs-right {
            position: relative;
            padding: 32px 24px 24px 0;
            background: radial-gradient(circle at top, #e0f2fe 0%, #dcfce7 60%, #fef9c3 100%);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cs-illustration-wrap {
            width: 100%;
            max-width: 360px;
            position: relative;
        }

        .cs-illustration-card {
            position: absolute;
            left: 50%;
            bottom: 4%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            border-radius: 16px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 16px 40px rgba(15, 23, 42, 0.18);
            font-size: 11px;
            color: #0f172a;
        }

        .cs-illustration-card-dot {
            width: 9px;
            height: 9px;
            border-radius: 999px;
            background: var(--accent-1);
        }

        .cs-illustration-card strong {
            font-weight: 600;
            display: block;
        }

        .cs-illustration-card span {
            color: #6b7280;
        }

        .cs-illustration svg {
            width: 100%;
            height: auto;
            display: block;
            filter: drop-shadow(0 14px 25px rgba(15, 23, 42, 0.25));
        }

        /* Animations */
        @keyframes floatA {

            0%,
            100% {
                transform: translate3d(0, 0, 0);
            }

            50% {
                transform: translate3d(30px, 15px, 0);
            }
        }

        @keyframes floatB {

            0%,
            100% {
                transform: translate3d(0, 0, 0);
            }

            50% {
                transform: translate3d(-24px, -18px, 0);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 0.45;
            }

            50% {
                transform: translate(-50%, -50%) scale(1.08);
                opacity: 0.75;
            }
        }

        @keyframes shimmer {
            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }
        }

        @keyframes barFlow {
            0% {
                transform: translateX(0);
            }

            50% {
                transform: translateX(6px);
            }

            100% {
                transform: translateX(0);
            }
        }

        @media (max-width: 900px) {
            .cs-card {
                grid-template-columns: 1fr;
            }

            .cs-right {
                padding: 0 24px 24px;
            }

            .cs-left {
                padding: 60px 22px 20px;
            }

            .cs-shell {
                padding: 16px;
            }

            .cs-top-bar {
                inset-inline: 18px;
            }
        }

        @media (max-width: 520px) {
            .cs-name {
                font-size: 26px;
            }

            .cs-coming {
                font-size: 14px;
                letter-spacing: 0.28em;
            }

            .cs-badges {
                gap: 8px;
            }

            .cs-top-note {
                display: none;
            }
        }
    </style>
</head>
