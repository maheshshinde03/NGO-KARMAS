<ng-template #DashboardDataModal let-modal let-rowData="DashboardData">
    <div class="modal-content">
        <div class="modal-header mb-3">
            <h4 class="modal-title" id="exampleModalLabel">{{dashboardHeader}}</h4>
            <button class="btn-close" type="button" (click)="closeModal()"></button>
        </div>
        <div class="modal-body">
            <app-table [jsonData]="DashboardData"></app-table>
        </div>
    </div>
</ng-template>
