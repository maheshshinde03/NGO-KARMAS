<div class="card invoice-card" (clickOutside)="clickOutside()">
    <div class="card-header pb-0">
        <div><h4>{{isNgoLogin ? 'Recent Assign Request' : 'Recent Requests'}}</h4></div>
        <div><h4>{{recentRequestAll?.length ?? 0}}</h4></div>
    </div>
    <div class="card-body checkbox-checked">
        <div class="datatable-wrapper datatable-loading no-footer searchable fixed-columns">
            <div class="table-responsive">
                <!-- Set height and scroll here -->
                <div class="datatable-container" style="max-height: 300px; overflow-y: auto;">
                    <table class="table datatable-table mb-0">
                        <thead class="bg-light">
                            <tr>
                                <th>Request ID No</th>
                                <th>Name</th>
                                <th>Categories</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            @for(data of recentRequestAll; track data) {
                            <tr>
                                <td>{{data.RequestId}}</td>
                                <td>
                                    <div class="d-flex align-items-center gap-2">
                                        <!-- <div class="flex-shrink-0">
                                            <img class="b-r-10" [src]="domain + data.request_user_file_path"  alt="user" width="40">
                                        </div> -->
                                        <div class="flex-grow-1">
                                            <a (click)="redirectToRequest(data)">
                                                <h6 class="f-w-500 mb-0" style="cursor: pointer;">{{data.request_user_name}}</h6>
                                            </a>
                                            <span class="font-light f-w-400 f-13">{{data.SahaykaEmailID}}</span>
                                        </div>
                                    </div>
                                </td>
                                <td>{{data.category_name}}</td>
                                <td>
                                    <button class="btn edge-btn f-13 w-100 btn-light-{{ getStatusClass(data.Status) }}">
                                        {{ data.status_name }}
                                    </button>
                                </td>
                            </tr>
                            }
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</div>
