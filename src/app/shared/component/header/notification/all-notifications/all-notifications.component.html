            <div class="notifications-container">
                <div class="notification-card" *ngFor="let item of notificationsData"
                    [class.viewed]="item.is_viewed === 1">
                    <div class="left-section">
                        <!-- <img class="user-img" [src]="item.user_image" alt="user" /> -->
                        <!-- <img class="user-img" [src]="sanitizeImage(item.user_image)" alt="user" /> -->
                        <img class="user-img" [src]="sanitizeImage(item.user_image)" />
                    </div>

                    <div class="right-section">
                        <div class="details-row">
                            <p class="notification-text">
                                {{ item.notification_details || 'New notification' }}
                            </p>
                        </div>

                        <div class="meta-row">
                            <span class="time">
                                {{ item.created_at | date:'MMM d, y, h:mm a' }}
                            </span>

                            <span class="badge" *ngIf="item.notification_type">
                                {{ item.notification_type.replace('-', ' ') }}
                            </span>
                        </div>
                    </div>
                </div>
            </div>
