<div class="d-flex align-items-center" (click)="open()" (clickOutside)="clickOutside()">
    <img [src]="profilePhoto ? profilePhoto : 'assets/images/avatar/Adprofile.jpg'" alt="User Avatar" class="avatar">
    <div class="flex-grow-1">
        <h5>{{profileDetails?.user_name}}</h5>
        <span *ngIf="profileDetails.ngo_id"> {{profileDetails?.full_name}}. ({{profileDetails?.role}})</span>
        <span *ngIf="!profileDetails.ngo_id">{{profileDetails?.role}}</span>
    </div>
</div>
<div class="custom-menu overflow-hidden" [class.show]="profile">
    <ul>
        <li class="d-flex" (click)="redirectToAccount()">
            <svg class="svg-color">
                <use href="assets/svg/iconly-sprite.svg#Profile"></use>
            </svg><a class="ms-2">Account</a>
        </li>
        <li class="d-flex" *ngIf="profileDetails.ngo_id" (click)="redirectToNgoAccount()">
            <svg class="svg-color">
                <use href="assets/svg/iconly-sprite.svg#Profile"></use>
            </svg><a class="ms-2">NGO Account</a>
        </li>
        <!-- <li class="d-flex">
            <svg class="svg-color">
                <use href="assets/svg/iconly-sprite.svg#Message"></use>
            </svg><a class="ms-2" [routerLink]="'/letter-box'">Inbox</a>
        </li> -->
        <!-- <li class="d-flex">
            <svg class="svg-color">
                <use href="assets/svg/iconly-sprite.svg#Document"></use>
            </svg><a class="ms-2" [routerLink]="'/todo'">Task</a>
        </li> -->
        <li class="d-flex" (click)="resetPassword()">
            <svg class="svg-color">
                <use href="assets/svg/iconly-sprite.svg#Lock"></use>
            </svg><a class="ms-2">Reset Password</a>
        </li>
        <li class="d-flex" (click)="logOut()">
            <svg class="svg-color">
                <use href="assets/svg/iconly-sprite.svg#Login"></use>
            </svg><a class="ms-2">Log Out</a>
        </li>
    </ul>
</div>
